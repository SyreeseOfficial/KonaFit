# Nightly: build the preview APK (catches native breakage) and run the Maestro flows on an EAS Android emulator.
name: Nightly build + E2E
on:
  schedule:
    - cron: '0 8 * * *'
jobs:
  build:
    type: build
    params:
      platform: android
      profile: e2e
  maestro:
    needs: [build]
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path:
        - .maestro/smoke.yaml
        - .maestro/lift-core-loop.yaml
