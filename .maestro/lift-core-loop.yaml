# Core loop: start a lift, add an exercise, log + tick a set, finish, see it in history.
# Run locally: maestro test .maestro/lift-core-loop.yaml   (dev build installed, fresh data)
appId: com.syreeseofficial.konafit
---
- launchApp:
    clearState: true
- tapOn: "Start"
- tapOn: "Lift"
- tapOn: "Add Exercise"
- tapOn: "Search exercises…"
- inputText: "Bench Press"
- tapOn:
    text: ".*Bench Press.*"
    index: 0
- tapOn:
    id: "set-weightLbs"
    index: 0
- inputText: "135"
- tapOn:
    id: "set-reps"
    index: 0
- inputText: "5"
- tapOn:
    id: "set-complete"
    index: 0
- assertVisible: "Finish"
- tapOn: "Finish"
- assertVisible: ".*135.*"
